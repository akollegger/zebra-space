name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Required by src/solver/'s tests (CLAUDE.md's MiniZinc prerequisite). Installed from the
      # official self-contained Linux bundle (bin/minizinc + bin/fzn-gecode + its own share/lib),
      # not Ubuntu's apt package: apt's 2.8.2 build (Noble) has a standard-library `all_different`
      # whose internal `global_cardinality` redefinition doesn't resolve for an enum-typed array
      # (confirmed on PR #20's first-ever real `all_different` solve in CI — ModelSyntaxError,
      # `global_cardinality(array[int] of var opt int, ...)` has no matching signature) — verified
      # working locally against a newer version instead. No separate solver registration step is
      # needed; the bundle's Gecode is already on PATH via bin/.
      - name: Install MiniZinc
        run: |
          set -e
          BUNDLE=/opt/MiniZincIDE-2.10.1-x86_64-linux-gnu
          curl -sL -o /tmp/minizinc.tgz \
            "https://github.com/MiniZinc/MiniZincIDE/releases/download/2.10.1/MiniZincIDE-2.10.1-x86_64-linux-gnu.tgz"
          sudo tar -xzf /tmp/minizinc.tgz -C /opt
          # Setting LD_LIBRARY_PATH job-wide (GITHUB_ENV) would apply it to every step's every
          # process — sed, pnpm, node, curl — not just this bundle's own binaries, and it broke
          # unrelated tools when tried that way. A wrapper scopes it to exactly the `minizinc`
          # invocation instead; LD_LIBRARY_PATH set here is inherited by whatever `minizinc`
          # itself spawns (fzn-gecode), so nothing else needs its own wrapper.
          sudo mkdir -p /opt/minizinc-wrapper
          printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s/lib"\nexec "%s/bin/minizinc" "$@"\n' "$BUNDLE" "$BUNDLE" \
            | sudo tee /opt/minizinc-wrapper/minizinc > /dev/null
          sudo chmod +x /opt/minizinc-wrapper/minizinc
          echo "/opt/minizinc-wrapper" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
