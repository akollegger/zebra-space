name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Required by src/solver/'s tests (CLAUDE.md's MiniZinc prerequisite) — Ubuntu's apt package
      # bundles Gecode, so no separate solver registration step is needed here.
      - name: Install MiniZinc
        run: sudo apt-get update && sudo apt-get install -y minizinc

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
