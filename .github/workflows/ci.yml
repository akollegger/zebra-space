name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Required by src/solver/'s tests (CLAUDE.md's MiniZinc prerequisite). Ubuntu's apt package
      # (2.8.2, Noble) bundles Gecode and needs no separate solver registration — but its
      # standard-library `all_different` has an internal `global_cardinality` redefinition that
      # doesn't resolve for an enum-typed array (confirmed on PR #20's first-ever real
      # `all_different` solve in CI: ModelSyntaxError, `global_cardinality(array[int] of var opt
      # int, ...)` has no matching signature).
      #
      # Fixed by swapping in just the newer stdlib's *text* (share/minizinc/std/*.mzn — the
      # redefinitions themselves, no binary involved) via `MZN_STDLIB_DIR`, rather than replacing
      # the `minizinc`/`fzn-gecode` binaries with a newer official release: that release turned
      # out to link `fzn-gecode` against the Qt IDE's GUI/GL stack (libEGL, libGL, …), which a
      # bare ubuntu-latest runner doesn't have and which has no relation to solving at all — a
      # packaging artifact of that bundle, not something worth chasing further. The bug here is
      # purely a compile-time type-resolution failure in the stdlib text, and Gecode's FlatZinc
      # interpreter never sees it (compilation fails before reaching FlatZinc), so swapping only
      # the text and keeping every apt-installed binary is the minimal, surgical fix.
      - name: Install MiniZinc
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y minizinc
          curl -sL -o /tmp/minizinc-std.tgz \
            "https://github.com/MiniZinc/libminizinc/archive/refs/tags/2.10.1.tar.gz"
          sudo mkdir -p /opt/minizinc-stdlib
          sudo tar -xzf /tmp/minizinc-std.tgz -C /opt/minizinc-stdlib --strip-components=3 \
            "libminizinc-2.10.1/share/minizinc"
          # apt's Gecode solver config (gecode.msc) still expects an include dir literally named
          # "gecode" — 2.10.1 renamed it to "gecode_presolver". Alias it rather than editing the
          # solver config itself.
          sudo cp -r /opt/minizinc-stdlib/gecode_presolver /opt/minizinc-stdlib/gecode
          echo "MZN_STDLIB_DIR=/opt/minizinc-stdlib" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
